name: Release
# Push a tag like v0.2.0 to publish. The in-app updater reads the latest release of this repository.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FLOWSTATE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret. Signing with a throwaway debug key, so this build cannot be installed over a build signed with a different key."
          fi
      - name: Build
        env:
          FLOWSTATE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLOWSTATE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLOWSTATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew check :composeApp:assembleRelease -PversionName="${GITHUB_REF_NAME#v}" -PversionCode="${{ github.run_number }}" --max-workers=2
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="FlowState-${GITHUB_REF_NAME}.apk"
          cp composeApp/build/outputs/apk/release/*.apk "$APK"
          sha256sum "$APK" | cut -d' ' -f1 > "$APK.sha256"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "$GITHUB_REF_NAME" --generate-notes
  windows:
    needs: android
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        shell: bash
        run: ./gradlew :composeApp:packageMsi -PversionName="${GITHUB_REF_NAME#v}" --max-workers=2
      - name: Attach installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSI="FlowState-${GITHUB_REF_NAME}.msi"
          cp composeApp/build/compose/binaries/main/msi/*.msi "$MSI"
          sha256sum "$MSI" | cut -d' ' -f1 > "$MSI.sha256"
          gh release upload "$GITHUB_REF_NAME" "$MSI" "$MSI.sha256"
