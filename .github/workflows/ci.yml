name: CI
on:
  push:
    tags-ignore: ['v*']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # GitHub's Ubuntu runners already include the Android SDK.
      - run: ./gradlew check :composeApp:assembleDebug --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: flowstate-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14
